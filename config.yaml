# Settings used automatically by Capture.bat (everything is optional).
# Full list of options: config.example.yaml. Remove the leading "#" to enable a line.

prompts:
  # Unfamiliar dialogs and other programs' windows: "ignore" leaves them open
  # (nothing is clicked) and keeps capturing; any page they cover is flagged
  # "obstruction_detected" in the report so you can check it.
  # Use "manual" to pause and ask instead, or "abort" to set the document aside.
  unknown_action: ignore
  obstruction_action: ignore

  # Only used with obstruction_action: manual/abort - how long another program's
  # pop-up gets to close on its own first.
  obstruction_wait_s: 30

  rules:
    # Example: a notification window from another program (here PDFMonitor's
    # "NotifyView"). Pick ONE action:
    #   wait   - wait for it to close (up to wait_s x max_times seconds)
    #   click  - press one of its buttons (button: <exact button text>)
    #   ignore - carry on anyway (the window will appear in the captured pages)
    #
    # - name: pdfmonitor-notification
    #   scope: other
    #   class_re: 'PDFMonitor\.exe'
    #   title_re: '^NotifyView$'
    #   action: wait
    #   wait_s: 5
    #   max_times: 24
